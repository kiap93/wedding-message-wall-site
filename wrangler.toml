name = "wedding-auth-worker"
main = "worker/index.ts"
compatibility_date = "2024-04-01"
account_id = "4c4c40d838a6dcea0783b300a9718180"

# Build step: Runs npm run build automatically before publishing assets
[build]
command = "npm run build"

# Cloudflare Workers Static Assets Configuration
# Serves the compiled React frontend directly from ./dist
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[vars]
GOOGLE_CLIENT_ID = "946837250683-434o0vtdrkoe2092vghh65md9nfr8hpu.apps.googleusercontent.com"
APP_URL = "https://eventframe.io"

# CLOUDFLARE WORKERS BUILDS CONFIGURATION:
# The Vite build command runs during deployment and requires build-time variables.
# Configure these in:
# Cloudflare Dashboard > Workers & Pages > wedding-auth-worker > Settings > Builds > "Build variables and secrets"
# - VITE_SUPABASE_URL = "https://<your-project>.supabase.co"
# - VITE_SUPABASE_ANON_KEY = "<your-anon-key>"

# WORKER RUNTIME SECRETS (Set using 'wrangler secret put <NAME>'):
# - GOOGLE_CLIENT_SECRET
# - JWT_SECRET
# - STRIPE_SECRET_KEY
# - STRIPE_WEBHOOK_SECRET
# - SUPABASE_URL
# - SUPABASE_SERVICE_ROLE_KEY
# - VITE_SUPABASE_ANON_KEY
# - RESEND_API_KEY
# - GEMINI_API_KEY
# - R2_ENDPOINT
# - R2_ACCESS_KEY_ID
# - R2_SECRET_ACCESS_KEY
# - R2_BUCKET_NAME
# - R2_PUBLIC_URL
